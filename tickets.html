<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="按日期快速開啟東京旅程票券與墨田水族館四人 QR Code。">
  <title>東京票券｜旅行工具</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .tool-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.tool-header h1{margin:4px 0 0;font-size:clamp(1.8rem,8vw,2.7rem);letter-spacing:-.04em}.home-link{display:inline-flex;align-items:center;color:var(--accent);font-weight:750;text-decoration:none}.ticket-days{display:grid;gap:12px}.day-accordion{overflow:hidden}.day-accordion>summary{display:flex;min-height:68px;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;cursor:pointer;list-style:none}.day-accordion>summary::-webkit-details-marker{display:none}.day-accordion>summary::after{content:"＋";color:var(--accent);font-size:1.25rem;font-weight:700}.day-accordion[open]>summary::after{content:"−"}.day-label{font-weight:850}.day-label small{display:block;margin-top:1px;color:var(--muted);font-size:.75rem}.day-content{padding:0 14px 14px;border-top:1px solid var(--line)}.empty-tickets{display:grid;min-height:112px;place-items:center;margin:14px 0 0;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:750}.ticket-group{margin-top:14px;padding:18px}.ticket-group:focus{outline:3px solid var(--accent);outline-offset:3px}.ticket-group__header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}.ticket-group h2{margin:2px 0 0;font-size:1.25rem}.ticket-time{margin:4px 0 0;color:var(--muted);font-size:.82rem;font-weight:700}.ticket-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.ticket-links a{display:inline-flex;min-height:44px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:11px;color:var(--accent);font-size:.78rem;font-weight:800;text-decoration:none}.booking-icon{font-size:1.65rem}.booking-summary{margin:0 0 8px;font-size:1.3rem;font-weight:850;letter-spacing:-.02em}.booking-passengers{display:flex;gap:7px;align-items:center;margin:0 0 14px;color:var(--muted);font-size:.82rem;font-weight:750}.booking-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--line)}.booking-facts div{min-width:0;padding:11px 12px;background:var(--surface-muted)}.booking-facts dt{color:var(--muted);font-size:.7rem;font-weight:750}.booking-facts dd{margin:2px 0 0;font-size:.87rem;font-weight:800;overflow-wrap:anywhere}.booking-address{display:grid;gap:3px;margin:12px 0 0;padding:12px;border-radius:12px;background:var(--accent-soft);font-size:.8rem}.booking-address span{color:var(--muted);overflow-wrap:anywhere}.holder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.holder-card{min-width:0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-muted)}.holder-card h3{margin:0 0 9px;font-size:.95rem}.qr-image-button{width:100%;min-height:0;padding:0;border:0;border-radius:10px;background:#fff;cursor:zoom-in;overflow:hidden}.qr-image-button img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.qr-placeholder{display:grid;min-height:180px;place-items:center;align-content:center;padding:18px;border:1px dashed #aeb8b2;border-radius:10px;background:var(--surface);color:var(--muted);text-align:center}.qr-placeholder span{font-size:2rem}.qr-placeholder strong,.qr-placeholder small{display:block}.qr-placeholder small{max-width:100%;margin-top:5px;font:600 .68rem/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.qr-dialog{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#07110d;color:#fff}.qr-dialog::backdrop{background:rgba(7,17,13,.82)}.qr-dialog__inner{display:grid;width:100%;height:100%;place-items:center;padding:max(72px,calc(56px + var(--safe-top))) max(18px,var(--safe-right)) max(24px,var(--safe-bottom)) max(18px,var(--safe-left));overflow:auto}.qr-dialog__figure{display:grid;max-width:min(92vw,720px);gap:8px;margin:0;text-align:center}.qr-dialog__figure img{display:block;width:min(82vw,640px);max-height:75vh;object-fit:contain;border-radius:14px;background:#fff;cursor:zoom-in;touch-action:pan-x pan-y}.qr-dialog__figure img.is-zoomed{width:min(164vw,1280px);max-width:none;max-height:none;cursor:zoom-out}.qr-dialog.is-zoomed .qr-dialog__inner{place-items:start}.qr-dialog.is-zoomed .qr-dialog__figure{max-width:none;margin:0 auto}.qr-dialog__figure figcaption{font-weight:800}.qr-dialog__hint{margin:0;color:#ffffffb8;font-size:.76rem}.qr-dialog__close{position:fixed;top:max(12px,var(--safe-top));right:max(12px,var(--safe-right));z-index:2;min-width:48px;padding:8px 14px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:#fff;color:#07110d;font-weight:850;cursor:pointer}.bottom-nav-spacer{height:12px}@media(max-width:480px){.holder-grid{grid-template-columns:1fr}.ticket-group{padding:14px}.qr-placeholder{min-height:220px}.booking-facts{grid-template-columns:1fr}}@media(min-width:700px){.day-content{padding-right:18px;padding-bottom:18px;padding-left:18px}.ticket-group{padding:22px}.holder-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="tool-header">
      <div><p class="eyebrow">TOKYO · 09.25–09.30</p><h1>票券</h1></div>
      <a class="home-link" href="index.html">首頁</a>
    </header>

    <section class="ticket-days" data-ticket-days aria-label="每日票券">
      <p class="empty-tickets">正在載入票券…</p>
    </section>
    <div class="bottom-nav-spacer" aria-hidden="true"></div>
  </main>

  <nav class="bottom-nav" aria-label="主要工具">
    <a href="itinerary.html"><span class="bottom-nav__icon" aria-hidden="true">🗓️</span>行程</a>
    <a href="checklist.html"><span class="bottom-nav__icon" aria-hidden="true">✅</span>Checklist</a>
    <a href="tickets.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true">🎫</span>票券</a>
    <a href="phrases.html"><span class="bottom-nav__icon" aria-hidden="true">💬</span>常用文字</a>
  </nav>

  <dialog class="qr-dialog" data-qr-dialog aria-labelledby="qr-dialog-title">
    <button class="qr-dialog__close" type="button" data-dialog-close aria-label="關閉放大票券">關閉</button>
    <div class="qr-dialog__inner">
      <figure class="qr-dialog__figure">
        <img data-dialog-image src="" alt="" role="button" tabindex="0" aria-pressed="false" aria-label="再次點擊放大 QR Code">
        <figcaption id="qr-dialog-title" data-dialog-title></figcaption>
        <p class="qr-dialog__hint">再點一下可放大 · 放大後可滑動查看</p>
      </figure>
    </div>
  </dialog>

  <script src="assets/js/core.js"></script>
  <script src="data/tickets.js"></script>
  <script src="assets/js/tickets.js"></script>
</body>
</html>
