<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="依旅行情境分類，可一鍵複製或播放日文的東京常用文字。">
  <title>東京常用文字｜旅行工具</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .tool-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.tool-header h1{margin:4px 0 0;font-size:clamp(1.8rem,8vw,2.7rem);letter-spacing:-.04em}.home-link{display:inline-flex;align-items:center;color:var(--accent);font-weight:750;text-decoration:none}.phrase-intro{margin:0 0 18px;color:var(--muted);font-size:.9rem}.phrase-tabs{display:flex;gap:8px;margin:0 -18px 18px;padding:3px 18px 7px;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin}.phrase-tab{display:inline-flex;min-width:max-content;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-weight:800;cursor:pointer}.phrase-tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.phrase-panel[hidden]{display:none}.phrase-list{display:grid;gap:12px}.phrase-card{padding:18px}.phrase-card__context{margin:0;color:var(--muted);font-size:.82rem;font-weight:750}.phrase-card__japanese{margin:9px 0 0;font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:clamp(1.45rem,6.5vw,2.05rem);font-weight:800;line-height:1.38;letter-spacing:.01em}.phrase-card__reading{margin:7px 0 0;color:var(--muted);font-size:.78rem;line-height:1.45}.phrase-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.phrase-action{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-muted);color:var(--ink);font-weight:800;cursor:pointer}.phrase-action--copy{border-color:var(--accent);background:var(--accent);color:#fff}.copy-status{min-height:46px;margin:0 0 14px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--muted);font-size:.82rem;font-weight:700}.copy-status:not(:empty){border-color:#b9d4c8;background:var(--accent-soft);color:var(--accent)}.bottom-nav-spacer{height:12px}@media(min-width:700px){.phrase-tabs{margin-right:0;margin-left:0;padding-right:0;padding-left:0}.phrase-list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.phrase-card{padding:21px}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="tool-header">
      <div><p class="eyebrow">TOKYO · 09.25–09.30</p><h1>常用文字</h1></div>
      <a class="home-link" href="index.html">首頁</a>
    </header>

    <p class="phrase-intro">選擇情境後，直接複製日文給對方看；支援的瀏覽器也可以播放日文。</p>
    <div class="phrase-tabs" data-phrase-tabs role="tablist" aria-label="常用文字情境"></div>
    <p class="copy-status" data-copy-status role="status" aria-live="polite" aria-atomic="true">點一下即可複製日文。</p>
    <div data-phrase-panels>
      <p class="surface-card">正在載入常用文字…</p>
    </div>
    <div class="bottom-nav-spacer" aria-hidden="true"></div>
  </main>

  <nav class="bottom-nav" aria-label="主要工具">
    <a href="itinerary.html"><span class="bottom-nav__icon" aria-hidden="true">🗓️</span>行程</a>
    <a href="checklist.html"><span class="bottom-nav__icon" aria-hidden="true">✅</span>Checklist</a>
    <a href="tickets.html"><span class="bottom-nav__icon" aria-hidden="true">🎫</span>票券</a>
    <a href="phrases.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true">💬</span>常用文字</a>
  </nav>

  <script src="assets/js/core.js"></script>
  <script src="data/phrases.js"></script>
  <script src="assets/js/phrases.js"></script>
</body>
</html>
