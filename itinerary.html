<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="按日期查看東京六日旅行的路線、交通與現場行動。">
  <title>東京行程｜旅行工具</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .tool-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.tool-header h1{margin:4px 0 0;font-size:clamp(1.8rem,8vw,2.7rem);letter-spacing:-.04em}.home-link{display:inline-flex;align-items:center;color:var(--accent);font-weight:750;text-decoration:none}.day-selector{display:grid;grid-template-columns:repeat(6,minmax(58px,1fr));gap:8px;margin:0 -18px 24px;padding:2px 18px 12px;overflow-x:auto;scrollbar-width:none}.day-selector::-webkit-scrollbar{display:none}.day-selector button{min-width:58px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);font-weight:800;cursor:pointer}.day-selector button span{display:block;font-size:.68rem;font-weight:650}.day-selector button.is-active{border-color:var(--accent);background:var(--accent);color:#fff}.day-panel:focus{outline:none}.day-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.day-header h2{margin:4px 0 0;font-size:clamp(1.45rem,6vw,2.15rem);line-height:1.15}.day-date{margin:5px 0 0;color:var(--muted);font-weight:700}.guide-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.84rem;font-weight:800;text-align:right;text-decoration:none}.route-summary{display:flex;gap:0;margin:0 0 18px;padding:0;overflow-x:auto;list-style:none;scrollbar-width:none}.route-summary::-webkit-scrollbar{display:none}.route-summary li{display:flex;flex:0 0 auto;align-items:center;color:var(--muted);font-size:.78rem;font-weight:750;white-space:nowrap}.route-summary li:not(:last-child)::after{content:"→";margin:0 8px;color:var(--accent)}.map-preview{margin-bottom:24px;overflow:hidden}.map-preview summary{display:flex;min-height:58px;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;font-weight:800}.map-preview summary small{color:var(--muted);font-size:.72rem;font-weight:650}.map-preview__frame{height:min(56vh,420px);border-top:1px solid var(--line);background:var(--surface-muted)}.map-preview iframe{width:100%;height:100%;border:0}.map-preview>a{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);color:var(--accent);font-size:.82rem;font-weight:800;text-decoration:none}.timeline{display:grid;gap:14px;margin:0;padding:0;list-style:none}.timeline-card{display:grid;grid-template-columns:76px minmax(0,1fr);overflow:hidden}.timeline-card__time{padding:18px 10px;background:var(--accent-soft);color:var(--accent);text-align:center}.timeline-card__time time,.timeline-card__time span{display:block}.timeline-card__time time{font-size:1rem;font-weight:850}.timeline-card__time span{margin-top:5px;font-size:.62rem;font-weight:800;line-height:1.25}.timeline-card__body{min-width:0;padding:18px}.timeline-card h3{margin:0;font-size:1.08rem;line-height:1.3}.timeline-card__body>p{margin:7px 0 0;color:var(--muted);font-size:.9rem}.instruction{padding:10px 12px;border-radius:12px;background:var(--surface-muted);color:var(--ink)!important}.transport{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.transport__mode{display:inline-block;margin:0 0 8px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.72rem;font-weight:850}.transport dl{display:grid;gap:5px;margin:0}.transport dl div{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px}.transport dt{color:var(--muted);font-size:.76rem;font-weight:750}.transport dd{margin:0;font-size:.82rem;font-weight:700}.plan-b{margin-top:13px;border-top:1px dashed var(--line);padding-top:10px}.plan-b summary{color:var(--danger);font-size:.8rem;font-weight:850;cursor:pointer}.plan-b p{margin:6px 0 0;color:var(--muted);font-size:.82rem}.event-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.action-link{display:inline-flex;min-height:40px;align-items:center;padding:7px 11px;border:1px solid var(--line);border-radius:10px;color:var(--accent);font-size:.76rem;font-weight:800;text-decoration:none}.action-link--primary{border-color:var(--accent);background:var(--accent);color:#fff}.action-link--ticket{border-color:#c59328;background:#fff8e4;color:#79580f}.empty-state{display:grid;min-height:240px;place-items:center;margin:0;color:var(--muted);font-size:1.25rem;font-weight:800}.bottom-nav-spacer{height:12px}@media(max-width:520px){.day-header{display:block}.guide-link{margin-top:9px;text-align:left}.timeline-card{grid-template-columns:68px minmax(0,1fr)}.timeline-card__body{padding:16px 14px}}@media(min-width:700px){.day-selector{margin-right:0;margin-left:0;padding-right:0;padding-left:0}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="tool-header">
      <div><p class="eyebrow">TOKYO · 09.25–09.30</p><h1>行程</h1></div>
      <a class="home-link" href="index.html">首頁</a>
    </header>

    <nav class="day-selector" data-day-selector aria-label="選擇行程日期">
      <button type="button" data-day="1" aria-controls="day-panel" aria-pressed="false">Day 1<span>09/25</span></button>
      <button type="button" data-day="2" aria-controls="day-panel" aria-pressed="false">Day 2<span>09/26</span></button>
      <button type="button" data-day="3" aria-controls="day-panel" aria-pressed="false">Day 3<span>09/27</span></button>
      <button type="button" data-day="4" aria-controls="day-panel" aria-pressed="false">Day 4<span>09/28</span></button>
      <button type="button" data-day="5" aria-controls="day-panel" aria-pressed="false">Day 5<span>09/29</span></button>
      <button type="button" data-day="6" aria-controls="day-panel" aria-pressed="false">Day 6<span>09/30</span></button>
    </nav>

    <section id="day-panel" class="day-panel" tabindex="-1" aria-live="polite">
      <p class="empty-state surface-card">正在載入行程…</p>
    </section>
    <div class="bottom-nav-spacer" aria-hidden="true"></div>
  </main>

  <nav class="bottom-nav" aria-label="主要工具">
    <a href="itinerary.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true">🗓️</span>行程</a>
    <a href="checklist.html"><span class="bottom-nav__icon" aria-hidden="true">✅</span>Checklist</a>
    <a href="tickets.html"><span class="bottom-nav__icon" aria-hidden="true">🎫</span>票券</a>
    <a href="phrases.html"><span class="bottom-nav__icon" aria-hidden="true">💬</span>常用文字</a>
  </nav>

  <script src="assets/js/core.js"></script>
  <script src="data/itinerary.js"></script>
  <script src="assets/js/itinerary.js"></script>
</body>
</html>
