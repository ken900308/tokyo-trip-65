const map=L.map("map",{zoomControl:true}).setView([35.71,139.81],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);let layers=[];
function clear(){layers.forEach(x=>map.removeLayer(x));layers=[]}function popup(s){return `<div class="popup"><b>${s.time} · ${s.title}</b><span>${s.desc}</span></div>`}
function render(which){clear();const keys=which==="all"?["day1","day2","day3"]:[which],bounds=[];document.querySelectorAll("[data-day]").forEach(b=>b.classList.toggle("active",b.dataset.day===which));const list=[];
