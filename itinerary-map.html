    <!-- 匯率轉換小工具（右下） -->
    <div class="fx-widget" id="fxWidget">
        <div class="fx-panel" id="fxPanel">
            <button id="fxClose" style="float:right;border:none;background:transparent;font-size:1.1rem;cursor:pointer;">✕</button>
            <h4>匯率換算</h4>
            <div class="fx-row">
                <select id="fxFrom" class="fx-select">
                    <option value="IDR" selected>印尼盾 IDR</option>
                    <option value="TWD">台幣 TWD</option>
                    <option value="USD">美金 USD</option>
                </select>
                <input id="fxAmount" class="fx-input" type="number" step="any" value="1">
            </div>
            <div class="fx-row">
                <select id="fxTo" class="fx-select">
                    <option value="TWD" selected>台幣 TWD</option>
                    <option value="IDR">印尼盾 IDR</option>
                    <option value="USD">美金 USD</option>
                </select>
                <input id="fxToAmount" class="fx-input" type="number" step="any" value="" placeholder="結果">
            </div>
            <div class="fx-row fx-swap-row">
                <button id="fxSwap" class="fx-swap">⇄</button>
            </div>
        </div>
        <button class="fx-button" id="fxToggle" title="匯率轉換">
            <i class="fas fa-exchange-alt"></i>
        </button>
    </div>

                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            }),
            attraction: new L.Icon({
                iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png",
                shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            }),
            transport: new L.Icon({
                iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",
                shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            })
        };

        const markerGroup = L.layerGroup().addTo(map);
        const markerMap = new Map();
        const stopDayMap = new Map();
        let activeRoute = null;
        let currentDay = "day1";
        let currentView = "all";
        let popupSuppressUntil = 0;
        let autoPopup = false;
        let routeToken = 0;

        function buildPopup(stop) {
            return `
                <div class="popup-card">
                    <img src="${stop.image}" alt="${stop.title}" />
                    <div class="popup-body">
                        <h4>${stop.title}</h4>
                        <p>${stop.desc}</p>
                    </div>
                </div>
            `;
        }

        function renderDayList() {
            const container = document.getElementById("day-list");
            container.innerHTML = days.map(day => {
                const stopsHtml = day.stops.map(stop => `
                    <li class="stop-item" data-stop-id="${stop.id}" data-day-id="${day.id}">
                        <span class="stop-time">${stop.time}</span>
                        <span class="stop-title">${stop.title}</span>
                    </li>
                `).join("");

                return `
                    <div class="day-card" data-day-id="${day.id}">
                        <div class="day-header">
                            <div>
                                <h3>${day.title}</h3>
                                <p>${day.subtitle}</p>
                            </div>
                            <button class="day-btn" data-day-btn="${day.id}">查看當天路線</button>
                        </div>
                        <ul class="stop-list">${stopsHtml}</ul>
                    </div>
                `;
            }).join("");
        }

        function renderDaySelector() {
            const selector = document.getElementById("day-selector");
            if (!selector) return;
            selector.innerHTML = days.map(day => {
                return `<button class="day-pill" data-day-pill="${day.id}">${day.title.split("：")[0]}</button>`;
            }).join("");
        }

        function setActiveDayPill(dayId) {
            document.querySelectorAll(".day-pill").forEach(pill => {
                pill.classList.toggle("active", pill.dataset.dayPill === dayId);
            });
        }

        function addMarkers() {
            days.forEach(day => {
                day.stops.forEach(stop => {
                    const icon = iconMap[stop.type] || iconMap.attraction;
                    const marker = L.marker([stop.lat, stop.lng], { icon })
                        .bindPopup(buildPopup(stop));
                    marker.on("click", suppressPopups);
                    marker.on("popupclose", suppressPopups);
                    markerGroup.addLayer(marker);
                    markerMap.set(stop.id, marker);
                    stopDayMap.set(stop.id, day.id);
                });
            });
        }

        function setMarkersForDay(dayId) {
            markerMap.forEach((marker, stopId) => {
                const isActive = stopDayMap.get(stopId) === dayId;
                marker.setOpacity(isActive ? 1 : 0);
                if (!isActive) {
                    marker.closePopup();
                }
            });
        }

        function resetMarkers() {
            markerMap.forEach(marker => {
                marker.setOpacity(1);
            });
        }

        function getDayStops(dayId) {
            return days.find(day => day.id === dayId)?.stops || [];
        }

        function getRoutePoints(stops) {
            return stops.map(stop => [stop.lat, stop.lng]);
        }

        function buildSmoothRoute(points) {
            if (points.length < 2) return points;
            const smoothed = [];

            for (let i = 0; i < points.length - 1; i += 1) {
                const start = points[i];
                const end = points[i + 1];
                const mid = [(start[0] + end[0]) / 2, (start[1] + end[1]) / 2];
                const dx = end[0] - start[0];
                const dy = end[1] - start[1];
                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                const offset = Math.min(distance * 0.2, 0.04);
                const perp = [-dy / distance, dx / distance];
                const control = [mid[0] + perp[0] * offset, mid[1] + perp[1] * offset];

                if (i === 0) {
                    smoothed.push(start);
                }

                for (let t = 0.1; t <= 1; t += 0.1) {
                    const inv = 1 - t;
                    const lat = inv * inv * start[0] + 2 * inv * t * control[0] + t * t * end[0];
                    const lng = inv * inv * start[1] + 2 * inv * t * control[1] + t * t * end[1];
                    smoothed.push([lat, lng]);
                }
            }

            return smoothed;
        }

        function clearRoute() {
            if (!activeRoute) return;
            if (activeRoute.timer) {
                clearInterval(activeRoute.timer);
            }
            if (activeRoute.restartTimer) {
                clearTimeout(activeRoute.restartTimer);
            }
            map.removeLayer(activeRoute.glow);
            map.removeLayer(activeRoute.line);
            activeRoute = null;
        }

        function suppressPopups() {
            if (autoPopup) return;
            popupSuppressUntil = Date.now() + 10000;
        }

        function focusStop(stop, shouldPan) {
            const marker = markerMap.get(stop.id);
            if (!marker) return;
            if (Date.now() >= popupSuppressUntil) {
                autoPopup = true;
                marker.openPopup();
                setTimeout(() => {
                    autoPopup = false;
                }, 0);
            }
            if (shouldPan) {
                map.panTo(marker.getLatLng(), { animate: true, duration: 0.4 });
            }
        }

        function startRouteTimer(route) {
            route.timer = setInterval(() => {
                route.glow.addLatLng(route.smoothPoints[route.index]);
                route.line.addLatLng(route.smoothPoints[route.index]);
                if (route.stopIndex < route.stops.length && route.index >= route.stepForStop * route.stopIndex) {
                    focusStop(route.stops[route.stopIndex], route.shouldPan);
                    route.stopIndex += 1;
                }
                route.index += 1;
                if (route.index >= route.smoothPoints.length) {
                    clearInterval(route.timer);
                    route.timer = null;
                    route.restartTimer = setTimeout(() => {
                        if (activeRoute && activeRoute.token === route.token) {
                            animateRoute(route.stops, route.color, route.shouldPan);
                        }
                    }, 3000);
                }
            }, 300);
        }

        function animateRoute(stops, color, shouldPan) {
            clearRoute();
            const points = getRoutePoints(stops);
            const smoothPoints = buildSmoothRoute(points);
            const token = routeToken + 1;
            routeToken = token;
            const glow = L.polyline([], {
                color: "#38bdf8",
                weight: 10,
                opacity: 0.25,
                lineCap: "round",
                lineJoin: "round"
            }).addTo(map);

            const line = L.polyline([], {
                color: color || "#0284c7",
                weight: 4,
                opacity: 0.95,
                dashArray: "8 10",
                lineCap: "round",
                lineJoin: "round"
            }).addTo(map);
            const stepForStop = stops.length > 1
                ? Math.floor((smoothPoints.length - 1) / (stops.length - 1))
                : 0;

            const route = {
                glow,
                line,
                stops,
                smoothPoints,
                shouldPan,
                color,
                stepForStop,
                index: 0,
                stopIndex: 0,
                timer: null,
                restartTimer: null,
                paused: false,
                token
            };

            if (stops.length) {
                focusStop(stops[0], shouldPan);
                route.stopIndex = 1;
            }

            startRouteTimer(route);
            activeRoute = route;
        }

        function fitRoute(points) {
            if (!points.length) return;
            const bounds = L.latLngBounds(points);
            map.fitBounds(bounds, { padding: [30, 30] });
        }

        function showAllRoute() {
            currentView = "all";
            resetMarkers();
            const allStops = days.flatMap(day => day.stops);
            const points = getRoutePoints(allStops);
            animateRoute(allStops, "#0f172a", false);
            fitRoute(points);
            setToolbarActive("all");
        }

        function showDayRoute(dayId) {
            currentView = "day";
            currentDay = dayId;
            setMarkersForDay(dayId);
            const stops = getDayStops(dayId);
            const points = getRoutePoints(stops);
            animateRoute(stops, "#0284c7", true);
            fitRoute(points);
            setToolbarActive("day");
            setActiveDayPill(dayId);
        }

        function setToolbarActive(view) {
            document.querySelectorAll(".map-btn").forEach(btn => {
                const isActive = btn.dataset.view === view;
                btn.classList.toggle("active", isActive);
            });
        }

        function setupInteractions() {
            document.querySelectorAll(".stop-item").forEach(item => {
                const stopId = item.dataset.stopId;
                const dayId = item.dataset.dayId;

                const openStop = () => {
                    const marker = markerMap.get(stopId);
                    if (marker) {
                        marker.openPopup();
                        map.panTo(marker.getLatLng(), { animate: true, duration: 0.6 });
                    }
                    document.querySelectorAll(".stop-item").forEach(el => el.classList.remove("active"));
                    item.classList.add("active");
                    if (currentView === "day") {
                        showDayRoute(dayId);
                    }
                };

                item.addEventListener("mouseenter", openStop);
                item.addEventListener("click", openStop);
            });

            document.querySelectorAll(".day-btn").forEach(button => {
                button.addEventListener("click", event => {
                    const dayId = event.currentTarget.dataset.dayBtn;
                    showDayRoute(dayId);
                    if (window.matchMedia("(max-width: 768px)").matches) {
                        const mapFrame = document.getElementById("itinerary-map");
                        if (mapFrame) {
                            mapFrame.scrollIntoView({ behavior: "smooth", block: "start" });
                        }
                    }
                });
            });

            document.querySelectorAll(".map-btn").forEach(button => {
                button.addEventListener("click", event => {
                    const view = event.currentTarget.dataset.view;
                    if (view === "all") {
                        showAllRoute();
                    } else {
                        showDayRoute(currentDay);
                    }
                });
            });

            document.querySelectorAll(".day-pill").forEach(button => {
                button.addEventListener("click", event => {
                    const dayId = event.currentTarget.dataset.dayPill;
                    showDayRoute(dayId);
                });
            });
        }

        renderDayList();
        renderDaySelector();
        addMarkers();
        showAllRoute();
        setActiveDayPill(currentDay);
        setupInteractions();

        document.querySelectorAll("nav ul li a").forEach(link => {
            link.addEventListener("click", () => {
                const toggle = document.getElementById("menu-toggle");
                if (toggle) toggle.checked = false;
            });
        });
    </script>
</body>
</html>
